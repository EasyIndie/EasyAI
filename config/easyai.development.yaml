app:
  env: "development"
  port: 3003
  log_level: "info"
  # LiteLLM Admin UI (keys / budgets / spend / logs), opened by the browser.
  console_url: "http://localhost:3005/ui"
  # 可选聊天界面（docker compose --profile chat up -d 启动 Open WebUI）
  chat_url: "http://localhost:3006"
  rate_limit_rpm: 120
  default_timeout_ms: 120000
  cache_enabled: true
  cache_ttl_seconds: 60
  num_retries: 2

secrets:
  # LiteLLM master key: console login password + internal admin key. Never hand this to API clients.
  master_key: "sk-dev-master"
  # Optional. Encrypts provider keys stored through the console. Defaults to a hash of master_key.
  # salt_key: "sk-change-me-and-keep-it-stable"
  api_keys:
    - "dev-key"
  internal_token: "dev-internal"
  postgres_password: "oneapi"

providers:
  ollama:
    api_base: "http://ollama:11434"
  openai:
    api_key: ""
  deepseek:
    api_base: "https://api.deepseek.com/v1"
    api_key: ""

models:
  chat:
    provider: ollama
    model: qwen2.5:0.5b
  dsv4flash:
    provider: deepseek
    model: deepseek-v4-flash
  dsv4pro:
    provider: deepseek
    model: deepseek-v4-pro
  gpt:
    provider: openai
    model: gpt-5.5
