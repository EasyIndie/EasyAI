app:
  env: "production"
  port: 3003
  log_level: "info"
  # 浏览器访问地址（改成实际域名/IP）：控制台（LiteLLM Admin UI）与聊天界面（Open WebUI）
  console_url: "http://localhost:3005/ui"
  chat_url: "http://localhost:3006"
  rate_limit_rpm: 120
  timeout_ms: 120000
  cache_enabled: true
  cache_ttl_seconds: 60
  num_retries: 2

secrets:
  # 控制台登录密码 + 网关访问 LiteLLM 的内部主密钥，不要发给 API 客户端
  master_key: "REPLACE_WITH_LITELLM_MASTER_KEY"
  # 加密控制台保存的厂商密钥，一旦使用不要再改
  salt_key: "REPLACE_WITH_STABLE_SALT_KEY"
  api_keys:
    - "REPLACE_WITH_CLIENT_API_KEY"
  internal_token: "REPLACE_WITH_INTERNAL_TOKEN"
  postgres_password: "REPLACE_WITH_POSTGRES_PASSWORD"

providers:
  ollama:
    api_base: "http://ollama:11434"

models:
  chat:
    provider: ollama
    model: qwen2.5:0.5b

