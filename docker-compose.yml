name: easyai-dev

x-postgres-password: &postgres_password "oneapi"

services:
  redis:
    image: redis:8.6.3-alpine
    restart: unless-stopped

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oneapi
      POSTGRES_PASSWORD: *postgres_password
      POSTGRES_DB: oneapi
    volumes:
      - postgres_data:/var/lib/postgresql

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  # Model access plane: official LiteLLM Proxy (provider adapters, routing,
  # retries, caching, guardrails, virtual keys, budgets, spend logs and the
  # Chinese-capable Admin UI at /ui).
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/scripts/docker/litellm-entrypoint.sh"]
    ports:
      # Admin console only. Kept on localhost by default; put it behind your
      # own proxy if you need remote access.
      - "127.0.0.1:3005:4000"
    volumes:
      - ./config/easyai.development.yaml:/app/config/easyai.yaml:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      - ollama
      - postgres
      - redis

  # EasyAI gateway: single entrypoint, chat UI, batch API.
  oneapi:
    build:
      context: ./oneapi-gateway
    restart: unless-stopped
    ports:
      - "3004:3003"
    volumes:
      - ./config/easyai.development.yaml:/app/config/easyai.yaml:ro
    depends_on:
      - redis
      - postgres
      - litellm

  # Optional chat UI (中文，多用户/RAG/工具). Enable with:
  #   docker compose --profile chat up -d
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["chat"]
    restart: unless-stopped
    ports:
      - "3006:8080"
    environment:
      OPENAI_API_BASE_URL: "http://oneapi:3003/v1"
      OPENAI_API_KEY: "dev-key"
      ENABLE_OLLAMA_API: "false"
      # 极速上手：默认免登录。生产请改为 true 并配置管理员账号。
      WEBUI_AUTH: "false"
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - oneapi

  batch_worker:
    build:
      context: ./batch-worker
    restart: unless-stopped
    volumes:
      - ./config/easyai.development.yaml:/app/config/easyai.yaml:ro
    depends_on:
      - redis
      - postgres
      - oneapi

volumes:
  openwebui_data:
    name: easyai_dev_openwebui_data
  postgres_data:
    name: easyai_dev_postgres_data
  ollama_data:
    name: easyai_dev_ollama_data
